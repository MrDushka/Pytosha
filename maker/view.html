<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проект · Конструктор</title>
<style>
 html,body{margin:0;height:100%;background:#0f1116;color:#eef1f6;font:16px system-ui,sans-serif}
 .center{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
 iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
</style></head><body>
<div class="center" id="msg">Загружаю проект…</div>
<script>
const API = 'https://bebjhpmknpcwwinhurtp.supabase.co/functions/v1/maker';
const id = new URLSearchParams(location.search).get('id') || '';
(async () => {
  if(!/^[a-z0-9]{6,16}$/i.test(id)){ document.getElementById('msg').textContent='Ссылка неправильная 🤔'; return; }
  try {
    const d = await (await fetch(API+'/project/'+id)).json();
    if(!d.found){ document.getElementById('msg').textContent='Проект не найден 🤔'; return; }
    document.title = (d.title||'Проект')+' · Конструктор';
    const f = document.createElement('iframe');
    f.setAttribute('sandbox','allow-scripts allow-pointer-lock allow-forms');
    f.srcdoc = d.html;
    document.body.innerHTML=''; document.body.appendChild(f);
  } catch(e){ document.getElementById('msg').textContent='Не удалось загрузить, попробуй позже.'; }
})();
</script></body></html>
